name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # STEP A: Check out repository source code
      - name: Checkout Repository
        uses: actions/checkout@v7

      # STEP B: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Tell npm to asociate the publication token with the public registry
          registry-url: 'https://registry.npmjs.org'

      # STEP C: Install project dependencies
      - name: Install Dependencies
        run: npm install

      # STEP D: Run automated tests
      # - name: Run Tests
      #   run: npm test

      # STEP E: Authenticate and publish package to npm
      - name: Publish to npm Registry
        run: |
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
